spring:
  application:
    name: task-management-api

  datasource:
    url: jdbc:h2:mem:taskdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    defer-datasource-initialization: true

  sql:
    init:
      mode: always

  # Redis
  data:
    redis:
      host: localhost
      port: 6379

  # Cache (Redis)
  cache:
    type: redis
    redis:
      time-to-live: 600000
      cache-null-values: false

server:
  port: 8080

# JWT Configuration
app:
  jwt:
    secret: dGhpcy1pcy1hLXNlY3VyZS1rZXktZm9yLWp3dC10b2tlbi1nZW5lcmF0aW9uLW11c3QtYmUtbG9uZy1lbm91Z2g=
    expiration-ms: 3600000  # 1 hour

logging:
  level:
    com.demo.taskapi: DEBUG
    org.springframework.security: INFO
    org.springframework.cache: DEBUG
